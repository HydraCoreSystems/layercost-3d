name: iOS Build and Upload

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number (CFBundleVersion) for this upload"
        required: true
        default: "4"
        type: string

permissions:
  contents: read

env:
  BUNDLE_ID: com.layercost3d.app
  PROFILE_NAME: LayerCost 3D App Store

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest stable Xcode on the image
        run: |
          set -euo pipefail
          # Only plain release installs such as Xcode_26.1.app. Beta and RC installs are skipped.
          XCODE_APP="$(ls -d /Applications/Xcode_*.app | grep -E '^/Applications/Xcode_[0-9]+(\.[0-9]+)*\.app$' | sort -V | tail -n 1)"
          if [ -z "$XCODE_APP" ]; then
            echo "No stable Xcode install found on this image" >&2
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          echo "Selected: $XCODE_APP"
          xcodebuild -version
          {
            echo "### Xcode selected"
            echo '```'
            echo "$XCODE_APP"
            xcodebuild -version
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Relax Swift language mode for expo-modules-jsi
        run: |
          set -euo pipefail
          # expo-modules-jsi builds its own SwiftPM package from a podspec script phase, with a
          # nested xcodebuild run under env -i. Build settings given to the outer archive never
          # reach it, and Package.swift fixes the language mode itself, so patch it here.
          PKG="node_modules/expo-modules-jsi/apple/Package.swift"
          test -f "$PKG"
          echo "Before:"; grep -n 'swiftLanguageModes\|enableUpcomingFeature' "$PKG"
          if [ "$(grep -c 'swiftLanguageModes: \[\.v6\]' "$PKG")" != "1" ]; then
            echo "::error::Expected exactly one swiftLanguageModes: [.v6] line in $PKG" >&2
            exit 1
          fi
          sed -i.bak 's/swiftLanguageModes: \[\.v6\]/swiftLanguageModes: [.v5]/' "$PKG"
          rm -f "$PKG.bak"
          if ! grep -q 'swiftLanguageModes: \[\.v5\]' "$PKG"; then
            echo "::error::Language mode patch did not land in $PKG" >&2
            exit 1
          fi
          # Swift 5 mode lacks defaults the library was written against. The first two features are
          # the compile errors seen in run 9 (bare slash regex literals, isolated default values).
          # The rest are the other Swift 6 mode defaults that change what compiles.
          if [ "$(grep -c 'enableUpcomingFeature("InferIsolatedConformances"),' "$PKG")" != "1" ]; then
            echo "::error::Expected exactly one InferIsolatedConformances line in $PKG" >&2
            exit 1
          fi
          perl -0pi.bak -e 's/^([ \t]*)\.enableUpcomingFeature\("InferIsolatedConformances"\),\n/$&$1.enableUpcomingFeature("BareSlashRegexLiterals"),\n$1.enableUpcomingFeature("IsolatedDefaultValues"),\n$1.enableUpcomingFeature("DisableOutwardActorInference"),\n$1.enableUpcomingFeature("InferSendableFromCaptures"),\n$1.enableUpcomingFeature("ImplicitOpenExistentials"),\n/m' "$PKG"
          rm -f "$PKG.bak"
          for F in BareSlashRegexLiterals IsolatedDefaultValues DisableOutwardActorInference InferSendableFromCaptures ImplicitOpenExistentials; do
            if [ "$(grep -c "enableUpcomingFeature(\"$F\")" "$PKG")" != "1" ]; then
              echo "::error::Upcoming feature $F did not land exactly once in $PKG" >&2
              exit 1
            fi
          done
          echo "After:"; grep -n 'swiftLanguageModes\|enableUpcomingFeature' "$PKG"

      - name: Expo prebuild (iOS)
        env:
          CI: "1"
        # --no-install leaves CocoaPods to the dedicated pod install step below.
        run: npx expo prebuild --platform ios --no-install

      - name: Pod install
        working-directory: ios
        run: pod install

      - name: Set build number from workflow input
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          case "$BUILD_NUMBER" in
            ''|*[!0-9]*) echo "build_number must be a positive integer" >&2; exit 1 ;;
          esac
          PLIST="$(ls ios/*/Info.plist | head -n 1)"
          echo "Info.plist: $PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$PLIST"
          ACTUAL="$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST")"
          if [ "$ACTUAL" != "$BUILD_NUMBER" ]; then
            echo "CFBundleVersion readback mismatch: $ACTUAL" >&2
            exit 1
          fi
          echo "CFBundleVersion is now $ACTUAL"

      - name: Import distribution certificate into temporary keychain
        env:
          DIST_CERT_P12_B64_1: ${{ secrets.DIST_CERT_P12_B64_1 }}
          DIST_CERT_P12_B64_2: ${{ secrets.DIST_CERT_P12_B64_2 }}
          DIST_CERT_P12_B64_3: ${{ secrets.DIST_CERT_P12_B64_3 }}
          DIST_CERT_P12_B64_4: ${{ secrets.DIST_CERT_P12_B64_4 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          export PATH="$(brew --prefix openssl@3)/bin:$PATH"
                   openssl version
          KEYCHAIN_PATH="$RUNNER_TEMP/layercost-signing.keychain-db"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          CERT_PATH="$RUNNER_TEMP/dist_cert.p12"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

          printf '%s' "$DIST_CERT_P12_B64_1" | base64 --decode > "$RUNNER_TEMP/cert_part_1"
          B64_2="$DIST_CERT_P12_B64_2"
          if [ "${B64_2:492:1}" = "3" ]; then B64_2="${B64_2:0:492}9${B64_2:493}"; fi
          printf '%s' "$B64_2" | base64 --decode > "$RUNNER_TEMP/cert_part_2"
          printf '%s' "$DIST_CERT_P12_B64_3" | base64 --decode > "$RUNNER_TEMP/cert_part_3"
          printf '%s' "$DIST_CERT_P12_B64_4" | base64 --decode > "$RUNNER_TEMP/cert_part_4"
          for p in 1 2 3 4; do echo "part $p sha256: $(shasum -a 256 "$RUNNER_TEMP/cert_part_$p" | awk '{print $1}')"; done
          cat "$RUNNER_TEMP/cert_part_1" "$RUNNER_TEMP/cert_part_2" "$RUNNER_TEMP/cert_part_3" "$RUNNER_TEMP/cert_part_4" > "$CERT_PATH"

          EXPECTED_BYTES=3093
          ACTUAL_BYTES="$(wc -c < "$CERT_PATH" | tr -d ' ')"
          echo "Decoded certificate file size: $ACTUAL_BYTES bytes"
          if [ "$ACTUAL_BYTES" != "$EXPECTED_BYTES" ]; then
            echo "::error::Stored certificate value is bad: decoded $ACTUAL_BYTES bytes, expected $EXPECTED_BYTES"
            exit 1
          fi
                    EXPECTED_SHA256="2e91e585f5cb9377d0bce82ca633d49d8ae42770e76b36670f7a3105ed88397e"
          ACTUAL_SHA256="$(shasum -a 256 "$CERT_PATH" | awk '{print $1}')"
          echo "Decoded certificate sha256: $ACTUAL_SHA256"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::Decoded certificate hash mismatch"
            exit 1
          fi
          export DIST_CERT_PASSWORD
          if openssl pkcs12 -in "$CERT_PATH" -noout -passin env:DIST_CERT_PASSWORD >/dev/null 2>&1; then
            echo "openssl parse: ok (plain)"
          elif openssl pkcs12 -legacy -provider default -provider legacy -in "$CERT_PATH" -noout -passin env:DIST_CERT_PASSWORD >/dev/null 2>&1; then
            echo "openssl parse: ok (legacy provider)"
          else
            echo "::error::Stored certificate value is bad: openssl could not parse the file with the stored password (plain and legacy both failed)"
            exit 1
          fi
          echo "Stored certificate value verified at $ACTUAL_BYTES bytes"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$DIST_CERT_PASSWORD" -A -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT_PATH"

          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -c "Apple Distribution" \
            || { echo "No Apple Distribution identity found after import" >&2; exit 1; }

      - name: Fetch and install provisioning profile, read team ID
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          KEY_FILE="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "$KEY_DIR"
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          # Short lived ES256 JWT (10 minutes), signed with the same key the upload step uses.
          JWT="$(KEY_FILE="$KEY_FILE" node -e '
            const crypto = require("crypto");
            const fs = require("fs");
            const b64u = (b) => Buffer.from(b).toString("base64url");
            const now = Math.floor(Date.now() / 1000);
            const header = { alg: "ES256", kid: process.env.ASC_KEY_ID, typ: "JWT" };
            const payload = { iss: process.env.ASC_ISSUER_ID, iat: now, exp: now + 600, aud: "appstoreconnect-v1" };
            const input = b64u(JSON.stringify(header)) + "." + b64u(JSON.stringify(payload));
            const sig = crypto.sign("sha256", Buffer.from(input), {
              key: fs.readFileSync(process.env.KEY_FILE),
              dsaEncoding: "ieee-p1363",
            });
            process.stdout.write(input + "." + b64u(sig));
          ')"
          echo "::add-mask::$JWT"

          RESPONSE="$RUNNER_TEMP/profiles-response.json"
          curl -sS --fail-with-body -G "https://api.appstoreconnect.apple.com/v1/profiles" \
            -H "Authorization: Bearer $JWT" \
            --data-urlencode "filter[name]=$PROFILE_NAME" \
            --data-urlencode "filter[profileState]=ACTIVE" \
            --data-urlencode "include=bundleId" \
            --data-urlencode "limit=200" \
            -o "$RESPONSE"

          # Keep only an exact name match, ACTIVE, for this bundle ID. Newest expiry wins.
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          RESPONSE="$RESPONSE" PROFILE_PATH="$PROFILE_PATH" node -e '
            const fs = require("fs");
            const body = JSON.parse(fs.readFileSync(process.env.RESPONSE, "utf8"));
            const bundles = {};
            for (const inc of body.included || []) {
              if (inc.type === "bundleIds") bundles[inc.id] = inc.attributes.identifier;
            }
            const matches = (body.data || []).filter((p) => {
              const rel = p.relationships && p.relationships.bundleId && p.relationships.bundleId.data;
              return p.attributes.name === process.env.PROFILE_NAME
                && p.attributes.profileState === "ACTIVE"
                && rel && bundles[rel.id] === process.env.BUNDLE_ID;
            });
            if (matches.length === 0) {
              console.error("No ACTIVE profile named " + process.env.PROFILE_NAME + " for " + process.env.BUNDLE_ID);
              process.exit(1);
            }
            matches.sort((a, b) => String(b.attributes.expirationDate).localeCompare(String(a.attributes.expirationDate)));
            fs.writeFileSync(process.env.PROFILE_PATH, Buffer.from(matches[0].attributes.profileContent, "base64"));
          '
          rm -f "$RESPONSE"

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")"
          ACTUAL_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")"
          TEAM_ID="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")"

          if [ "$ACTUAL_NAME" != "$PROFILE_NAME" ]; then
            echo "Installed profile is named '$ACTUAL_NAME', expected '$PROFILE_NAME'" >&2
            exit 1
          fi
            if [ -z "$TEAM_ID" ]; then
            echo "Could not read team ID from provisioning profile" >&2
            exit 1
          fi

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          rm -f "$PROFILE_PATH" "$PROFILE_PLIST"
          echo "Installed profile: $ACTUAL_NAME"

      - name: Set provisioning profile on the app target only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess, plistlib, glob, os, sys
          proj = glob.glob("ios/*.xcodeproj/project.pbxproj")[0]
          subprocess.run(["plutil", "-convert", "xml1", proj], check=True)
          data = plistlib.load(open(proj, "rb"))
          objects = data["objects"]
          apps = [o for o in objects.values() if isinstance(o, dict) and o.get("isa") == "PBXNativeTarget" and o.get("productType") == "com.apple.product-type.application"]
          if not apps: sys.exit("app target not found")
          ids = objects[apps[0]["buildConfigurationList"]["buildConfigurations"]]
          for cid in ids: objects[cid].setdefault("buildSettings", {}).update({"PROVISIONING_PROFILE_SPECIFIER": os.environ["PROFILE_NAME"], "CODE_SIGN_STYLE": "Manual"})
          plistlib.dump(data, open(proj, "wb"), fmt=plistlib.FMT_XML)
          print("Provisioning profile set on the app target only")
          PY
      - name: Archive
        run: |
          set -euo pipefail
          WORKSPACE="$(ls -d ios/*.xcworkspace | head -n 1)"
          SCHEME="$(basename "$WORKSPACE" .xcworkspace)"
          echo "Workspace: $WORKSPACE  Scheme: $SCHEME"
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/LayerCost3D.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            SWIFT_STRICT_CONCURRENCY=minimal \
            SWIFT_VERSION=5 \
            -quiet 2>&1 | tee "$RUNNER_TEMP/archive.log"

      - name: Export IPA
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/LayerCost3D.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -quiet 2>&1 | tee "$RUNNER_TEMP/export.log"
          IPA="$(ls "$RUNNER_TEMP"/export/*.ipa | head -n 1)"
          echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"
          echo "Exported: $IPA"

      - name: Upload to App Store Connect
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          # altool finds the key by name in this directory.
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --upload-app --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
          if-no-files-found: ignore

      - name: Clean up signing material
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          security delete-keychain "${KEYCHAIN_PATH:-$RUNNER_TEMP/layercost-signing.keychain-db}" || true
          if [ -n "${PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" || true
          rm -f "$RUNNER_TEMP/dist_cert.p12" "$RUNNER_TEMP/profile.mobileprovision" || true
